[project]
name = "global-height-fusion-pipeline"
version = "0.2.0"
description = "Fuse Meta canopy height rasters with Overture building heights into a single-band GeoTIFF."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.34.0",
    "duckdb>=1.1.0",
    "geopandas>=0.14.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pyproj>=3.6.0",
    "rasterio>=1.3.10",
    "shapely>=2.0.0",
]
keywords = ["canopy height", "buildings", "overture", "geotiff", "3d city"]

[project.urls]
Repository = "https://github.com/DOGZzl1xy/TreeBuilding2Tiff"

[project.scripts]
height-fusion = "height_fusion_pipeline.cli:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/height_fusion_pipeline"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "ruff>=0.11.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
