[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "global-height-fusion-pipeline"
version = "0.1.0"
description = "AWS-native Python pipeline to fuse Meta canopy height rasters with Overture building vectors."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "boto3>=1.34.0",
  "duckdb>=1.1.0",
  "geopandas>=0.14.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "pyproj>=3.6.0",
  "rasterio>=1.3.10",
  "shapely>=2.0.0",
]

[project.scripts]
height-fusion = "height_fusion_pipeline.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
